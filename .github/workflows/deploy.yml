name: Deploy to Self-Hosted Server

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Assets (Cloud Runner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Composer Dependencies (for Ziggy & assets)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install NPM & Build
        run: |
          npm ci || npm install --prefer-offline --no-audit
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build/
          retention-days: 1

  test:
    name: Test & Security Audit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, dom, fileinfo, gd, zip, intl, bcmath, curl, pdo_sqlite, sqlite3

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: public/build/

      - name: Install Composer Dependencies (with dev)
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Peringatan saja (tidak menggagalkan deploy) agar advisory pihak ketiga
      # tidak memblokir hotfix. Hapus continue-on-error untuk membuatnya wajib lulus.
      - name: Composer Security Audit
        run: composer audit --locked
        continue-on-error: true

      - name: Run Tests
        run: php artisan test

  deploy:
    name: Deploy to Server
    needs: [build, test]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: public/build/

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Deploy to Web Directory
        run: |
          rsync -avz --delete \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='.env' \
          --exclude='/storage' \
          --exclude='/node_modules' \
          --exclude='/public/storage' \
          ./ /var/www/habit/

      - name: Backup Database (sebelum migrasi)
        run: bash scripts/backup-db.sh /var/www/habit/.env "$HOME/habit-backups"

      - name: Optimizations & Migrations
        run: |
          cd /var/www/habit
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache
          php artisan storage:link
          php artisan queue:restart
