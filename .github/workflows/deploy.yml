name: Deploy to Self-Hosted Server

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Assets (Cloud Runner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Composer Dependencies (for Ziggy & assets)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install NPM & Build
        run: |
          npm ci || npm install --prefer-offline --no-audit
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build/
          retention-days: 1

  test:
    name: Test & Security Audit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, dom, fileinfo, gd, zip, intl, bcmath, curl, pdo_sqlite, sqlite3

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: public/build/

      - name: Install Composer Dependencies (with dev)
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Peringatan saja (tidak menggagalkan deploy) agar advisory pihak ketiga
      # tidak memblokir hotfix. Hapus continue-on-error untuk membuatnya wajib lulus.
      - name: Composer Security Audit
        run: composer audit --locked
        continue-on-error: true

      - name: Run Tests
        run: php artisan test

  deploy:
    name: Deploy to Server
    needs: [build, test]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: public/build/

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Prepare Web Directory Permissions
        run: |
          if sudo -n true 2>/dev/null; then
            sudo chown -R "$USER:www-data" /var/www/habit
            sudo find /var/www/habit -type d -exec chmod 755 {} +
            sudo find /var/www/habit -type f -exec chmod 644 {} +
            sudo chmod 640 /var/www/habit/.env 2>/dev/null || true
            sudo chmod -R 775 /var/www/habit/storage /var/www/habit/bootstrap/cache
          fi

      - name: Deploy to Web Directory
        run: |
          rsync -avz --delete \
            --no-perms --no-owner --no-group \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='/storage' \
            --exclude='/node_modules' \
            --exclude='/public/storage' \
            --exclude='/bootstrap/cache/*.php' \
            --exclude='/.phpunit.result.cache' \
            ./ /var/www/habit/

      - name: Backup Database (sebelum migrasi)
        run: bash scripts/backup-db.sh /var/www/habit/.env "$HOME/habit-backups"

      - name: Optimizations & Migrations
        run: |
          cd /var/www/habit
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache
          php artisan storage:link
          php artisan queue:restart
          if sudo -n true 2>/dev/null; then
            sudo chown -R www-data:www-data /var/www/habit/storage /var/www/habit/bootstrap/cache
            sudo chmod -R 775 /var/www/habit/storage /var/www/habit/bootstrap/cache
            sudo chmod 640 /var/www/habit/.env 2>/dev/null || true
          fi
