<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Sedang Offline — Sahabat SDAM</title>
    <meta name="theme-color" content="#f8fafc">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #475569;
            --primary: #059669;
            --primary-hover: #047857;
            --subtle: #f1f5f9;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #020617;
                --card: #0f172a;
                --border: #1e293b;
                --text: #f1f5f9;
                --muted: #94a3b8;
                --primary: #10b981;
                --primary-hover: #059669;
                --subtle: #1e293b;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(1rem + env(safe-area-inset-top)) 1rem calc(1rem + env(safe-area-inset-bottom));
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 1.25rem;
        }
        .brand img { width: 24px; height: 24px; border-radius: 6px; }
        .icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: var(--subtle);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }
        h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
        p { margin-top: 0.5rem; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
        .btn {
            margin-top: 1.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0.625rem 1.5rem;
            border-radius: 12px;
            background: var(--primary);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.875rem;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
    <main class="card" role="alert">
        <div class="brand">
            <img src="/img/icon-192.png" alt="Logo SAHABAT SDAM">
            <span>SAHABAT SDAM</span>
        </div>
        <div class="icon-wrap" aria-hidden="true">
            <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.5 16.5a5 5 0 017 0M5 13a9.97 9.97 0 015.58-2.75M19 13a9.97 9.97 0 00-3.11-2.06M12 20h.01" />
            </svg>
        </div>
        <h1>Tidak Ada Koneksi Internet</h1>
        <p>Perangkat Anda sedang offline. Periksa Wi-Fi atau data seluler, lalu coba muat ulang halaman.</p>
        <button type="button" class="btn" onclick="window.location.reload()">Coba Lagi</button>
    </main>
    <script>
        window.addEventListener('online', function () { window.location.reload(); });
    </script>
</body>
</html>
